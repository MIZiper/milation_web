name: Deploy Svelte App to GitHub Pages

on:
  push:
    branches:
      - main  # or your default branch

jobs:
  build-and-deploy:
    permissions:
      contents: write
      
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Extract repo name and set public path
        run: |
          REPO_NAME=$(basename ${{ github.repository }})
          echo "VITE_PUBLIC_PATH=/$REPO_NAME/" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          cd sv-frontend
          npm install

      - name: Build project
        run: |
          cd sv-frontend
          npm run build

      - name: Add SPA fallback for client-side routes
        run: cp sv-frontend/dist/index.html sv-frontend/dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: sv-frontend/dist
